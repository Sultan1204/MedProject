name: Backend CI

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    name: Lint, static analysis, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: medconnect
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: medconnect_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medconnect"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: medconnect
      DB_PASSWORD: ci-only-password
      REDIS_HOST: 127.0.0.1

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, pgsql, intl, bcmath, pcntl, posix, zip, redis
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Dependency vulnerability audit
        run: composer audit --no-dev --locked

      - name: Prepare environment
        run: php scripts/make-env.php .env.example .env

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Migrations (fresh, rollback, re-run)
        env:
          DB_DATABASE: medconnect_test
        run: |
          php artisan migrate:fresh --force
          php artisan migrate:rollback --force
          php artisan migrate --force --seed

      - name: Tests
        run: php artisan test

      - name: OpenAPI document is up to date
        # Scramble reads column types from the (migrated) database, so the export
        # must use the same database the migrations ran against.
        env:
          DB_DATABASE: medconnect_test
        run: |
          php artisan scramble:export
          git diff --exit-code -- docs/api/openapi.json || (echo "::error::Run 'php artisan scramble:export' and commit docs/api/openapi.json" && exit 1)
